server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # To default orio tou nginx einai 1MB - poly mikro gia arxeia Excel.
    # To backend dexetai mexri 10MB, opote to nginx prepei na symfonei mazi tou·
    # alliws to anevasma tha ekove EDO, prin ftasei kan sto backend.
    client_max_body_size 10M;

    # Ola ta /api pane sto backend container. To onoma "backend" to lyni to Docker
    # apo to onoma tis ypiresias sto docker-compose.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        # $http_host (kai OXI $host): kratae kai ti thyra, p.x. "localhost:3000".
        # To backend to xreiazetai gia na ftiaxei sostes dieuthinseis pros ta ekso.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # X-Forwarded-Host me ti THYRA mesa ("localhost:3000"). To $http_host einai
        # oti eide o browser· to nginx apo mesa xerei mono ti diki tou thyra (80)
        # kai den exei tropo na mantepsei se poia thyra to dimosievse to Docker.
        proxy_set_header   X-Forwarded-Host  $http_host;
    }

    # To Swagger na einai prosvasimo apo tin idia porta me tin efarmogi.
    #
    # PROSOXI sto Host header: xoris auto, to nginx stelnei "Host: backend:8080" kai
    # to Swagger ftiaxnei server URL "http://backend:8080" - onoma pou yparxei MONO
    # mesa sto diktyo tou Docker. To "Try it out" tha apotygxane apo ton browser.
    location /swagger-ui/ {
        proxy_pass       http://backend:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
    }
    location = /swagger-ui.html {
        proxy_pass       http://backend:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
    }
    location /v3/api-docs {
        proxy_pass       http://backend:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
    }

    # Ta arxeia me hash sto onoma (p.x. index-a1b2c3.js) den allazoun pote periexomeno,
    # opote mporoun na menoun sti mnimi tou browser gia panta.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: to React Router diaxeirizetai tis diadromes, oxi o server.
    # Xoris auto, ena refresh sto /faults/5 tha edine 404 apo to nginx -
    # kai i selida "Η σελίδα δεν βρέθηκε" pou ftiaksame den tha emfanizotan pote,
    # giati den tha eftane kan sto React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
