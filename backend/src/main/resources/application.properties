spring.application.name=maintrack-backend
server.port=8080

# --- Sindesi me ti vasi (SQL Server) ---
# I diefthinsi tis vasis DEN einai karfoti: erxetai apo tin metavliti perivallontos
# DB_URL. An den oristei, xrisimopoieitai i timi meta tin ano-kato teleia, pou einai
# to topiko SQL Server Express tou developer.
#
# Gia na trexei kapoios allos tin efarmogi me Docker (docker compose up -d), arkei
# na orisei prin tin ekkinisi:
#   DB_URL=jdbc:sqlserver://localhost:1433;databaseName=maintrackdb;encrypt=true;trustServerCertificate=true
#   DB_USERNAME=sa
#   DB_PASSWORD=<o kodikos apo to .env>
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=maintrackdb;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:maintrack_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
# "update" = an den yparxoun oi pinakes, tous ftiaxnei. An yparxoun, tous prosarmozei. Den svinei dedomena.
spring.jpa.hibernate.ddl-auto=update

# ELLINIKA: apothikevoume ta keimena san Unicode (nvarchar) kai OXI san varchar.
#
# Giati: to varchar sto SQL Server kratae tous xaraktires symfona me to COLLATION tis
# vasis. An i vasi exei to proepilegmeno "Latin1" (opos o SQL Server mesa se Docker),
# ta ellinika DEN xoraen kai apothikevontai san "?????". To eidame stin praxi:
# to "Γραμμή Ψυχρής Έλασης 1" ginotan "G?αμμ? ?????? ??as?? 1".
#
# Me to nvarchar i apothikefsi einai Unicode kai douleuei se KATHE vasi, anexartita
# apo to collation tis - opote i efarmogi trexei sosta kai se ksenó perivallon.
spring.jpa.properties.hibernate.use_nationalized_character_data=true
# Mas deixnei sto console tis entoles SQL pou stelnei - xrisimo gia na blepoume ti ginetai
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Anevasma arxeion (Excel import) ---
# To default tou Spring einai 1MB - poly mikro gia arxeia Excel me polles grammes.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JWT (Authentication) ---
# To "kleidi" pou xrisimopoiei o server gia na ypografei/elegxei ta tokens.
# PROSOXI: prepei na to bazoume os environment variable, oxi na to grafoume edo mesa.
jwt.secret=${JWT_SECRET}
# Poso kairo isxyei to token (se milisecond). 86400000 = 24 ores.
jwt.expiration-ms=86400000
