spring.application.name=maintrack-backend
server.port=8080

# --- Sindesi me ti vasi (SQL Server Express) ---
spring.datasource.url=jdbc:sqlserver://GEOSUMMERING96\\SQLEXPRESS;databaseName=maintrackdb;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:maintrack_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
# "update" = an den yparxoun oi pinakes, tous ftiaxnei. An yparxoun, tous prosarmozei. Den svinei dedomena.
spring.jpa.hibernate.ddl-auto=update
# Mas deixnei sto console tis entoles SQL pou stelnei - xrisimo gia na blepoume ti ginetai
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
