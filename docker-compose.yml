# Auto to arxeio "perigrafei" ena SQL Server pou trexei mesa se Docker container,
# etoimo gia to Maintrack backend. Xrisimopoieitai SAN ENALLAKTIKI sto na exeis
# egkatestimeno SQL Server Express topika - xrisimo an kapoios allos (p.x. o kathigitis)
# thelei na trexei tin efarmogi xoris na egkatastisei tipota sto systima tou.
#
# PROSOXI: auto DEN antikathista to topiko SQL Server Express pou xrisimopoieis
# gia tin kathimerini anaptixi (development) - einai mono gia oso theli kapoios
# na doulepsei/parousiasei tin efarmogi me Docker.
#
# Xrisi:
#   docker compose up -d        (xekinaei ti vasi se container, sto parasekinio)
#   docker compose down         (tin stamataei)
#   docker compose down -v      (tin stamataei KAI diagrafei ta dedomena tis)

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maintrack-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - maintrack_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [
        "CMD-SHELL",
        "( /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b > /dev/null 2>&1 ) || ( /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b > /dev/null 2>&1 )"
      ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Voithitiko container pou trexei MIA fora, dimiourgei ti vasi "maintrackdb" an leipei,
  # kai meta stamataei mono tou (den menei na trexei sinexeia san to sqlserver).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maintrack-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
    volumes:
      - ./docker/init-db.sh:/init-db.sh:ro
    entrypoint: ["bash", "/init-db.sh"]

volumes:
  maintrack_sqlserver_data:
