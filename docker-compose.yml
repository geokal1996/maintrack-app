# Sikonei OLOKLIRI tin efarmogi Maintrack me MIA entoli: vasi + backend + frontend.
#
# Skopos: opoiosdipote (p.x. o kathigitis) na mporei na trexei tin efarmogi XORIS
# na egkatastisei Java, Node, Maven i SQL Server sto mihanima tou. Mono Docker.
#
# Xrisi:
#   1) Antigrapse to .env.example se .env kai simplirose tis times
#   2) docker compose up -d --build      (xtizei kai xekinaei ta panta)
#   3) Anoikse http://localhost:3000
#
#   docker compose logs -f backend       (vlepeis ti kanei to backend)
#   docker compose down                  (stamataei ta panta)
#   docker compose down -v               (stamataei KAI svinei ta dedomena tis vasis)
#
# Simeiosi gia tin anaptyxi (development): otan doulevoume topika, DEN xreiazetai
# olo auto. Arkei "docker compose up -d sqlserver db-init" gia ti vasi, kai to
# backend/frontend trexoun apo to IDE kai to npm run dev.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maintrack-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - maintrack_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [
        "CMD-SHELL",
        "( /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b > /dev/null 2>&1 ) || ( /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b > /dev/null 2>&1 )"
      ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Voithitiko container pou trexei MIA fora: dimiourgei ti vasi "maintrackdb" kai
  # ton xristi efarmogis, kai meta stamataei mono tou.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maintrack-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
      APP_DB_USERNAME: ${DB_USERNAME:-maintrack_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:-Maintrack!App2026}
    volumes:
      - ./docker/init-db.sh:/init-db.sh:ro
    entrypoint: ["bash", "/init-db.sh"]

  backend:
    build:
      context: ./backend
    container_name: maintrack-backend
    # Perimenei na TELEIOSEI to db-init (oxi apla na "xekinisei"), alliws to
    # Hibernate tha prospathouse na syndethei se vasi pou den yparxei akoma.
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      # "sqlserver" einai to onoma tis ypiresias parapano - to Docker to metafrazei
      # se dieuthinsi diktyou. DEN vazoume "localhost": mesa sto container tou backend,
      # to localhost einai to IDIO to container, oxi i vasi.
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=maintrackdb;encrypt=true;trustServerCertificate=true
      DB_USERNAME: ${DB_USERNAME:-maintrack_app}
      DB_PASSWORD: ${DB_PASSWORD:-Maintrack!App2026}
      # To ":?" simainei "an leipei, stamata me auto to minima" - kalytero apo to
      # na xekinisei i efarmogi me keno kleidi kai na skasei argotera me akatanoito lathos.
      JWT_SECRET: ${JWT_SECRET:?Prepei na oristei to JWT_SECRET sto arxeio .env}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: maintrack-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 3000 sto mihanima sou -> 80 mesa sto container (nginx)
      - "3000:80"

volumes:
  maintrack_sqlserver_data:
